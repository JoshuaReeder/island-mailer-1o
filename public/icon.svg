  <ellipse cx="69" cy="25" rx="7" ry="2.5" fill="#a37c4f" opacity="0.95" transform="rotate(15,69,25)"/>
  <ellipse cx="49.5" cy="11" rx="5" ry="2" fill="#a37c4f" opacity="0.95" transform="rotate(-5,49.5,11)"/>
